services:
  - type: web
    name: crm-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: VITE_API_URL
        value: https://crm-system-73ir.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://crm-system-73ir.onrender.com
      - key: NODE_ENV
        value: production

